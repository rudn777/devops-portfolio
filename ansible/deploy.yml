---
- name: Деплой demo-app в Docker
  hosts: all
  vars:
    app_name: demo-app
    app_port: 8080
    install_docker: false      # true только для "чистого" сервера Debian/Ubuntu
    image: "{{ registry }}/{{ registry_project }}/{{ app_name }}:{{ image_tag }}"

  pre_tasks:
    - name: Проверить, что переданы обязательные переменные
      ansible.builtin.assert:
        that:
          - registry is defined
          - registry_project is defined
          - image_tag is defined
        fail_msg: "Нужны переменные registry, registry_project и image_tag"

  tasks:
    - name: Установить Docker и Python SDK для Docker (только если нужно)
      become: true
      ansible.builtin.apt:
        name: [docker.io, python3-docker]
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: install_docker | bool

    - name: Войти в реестр (если заданы учётные данные)
      community.docker.docker_login:
        registry_url: "{{ registry }}"
        username: "{{ registry_user }}"
        password: "{{ registry_password }}"
      no_log: true
      when: registry_user is defined and registry_password is defined

    - name: Скачать образ
      community.docker.docker_image:
        name: "{{ image }}"
        source: pull
        force_source: true

    - name: Запустить контейнер
      community.docker.docker_container:
        name: "{{ app_name }}"
        image: "{{ image }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ app_port }}:8080"

    - name: Дождаться ответа /health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        status_code: 200
      register: health
      retries: 10
      delay: 3
      until: health.status == 200
