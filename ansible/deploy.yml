---
- name: Деплой demo-app в Docker
  hosts: all
  become: true
  vars:
    app_name: demo-app
    app_port: 8080
    image: "{{ registry }}/{{ registry_project }}/{{ app_name }}:{{ image_tag }}"

  pre_tasks:
    - name: Проверить, что переданы обязательные переменные
      ansible.builtin.assert:
        that:
          - registry is defined
          - registry_project is defined
          - registry_user is defined
          - registry_password is defined
          - image_tag is defined
        fail_msg: "Не заданы переменные для доступа к Harbor или image_tag"

  tasks:
    - name: Установить Docker и Python SDK для Docker (Debian/Ubuntu)
      ansible.builtin.apt:
        name: [docker.io, python3-docker]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Запустить и включить службу Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Войти в Harbor
      community.docker.docker_login:
        registry_url: "{{ registry }}"
        username: "{{ registry_user }}"
        password: "{{ registry_password }}"
      no_log: true

    - name: Скачать образ
      community.docker.docker_image:
        name: "{{ image }}"
        source: pull
        force_source: true

    - name: Запустить контейнер
      community.docker.docker_container:
        name: "{{ app_name }}"
        image: "{{ image }}"
        state: started
        recreate: true
        restart_policy: unless-stopped
        published_ports:
          - "{{ app_port }}:8080"

    - name: Дождаться ответа /health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        status_code: 200
      register: health
      retries: 10
      delay: 3
      until: health.status == 200

    - name: Удалить неиспользуемые образы
      community.docker.docker_prune:
        images: true
